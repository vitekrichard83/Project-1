<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #f9c6e0, #c6e0f9, #c6f9d8, #f9f0c6);
      background-size: 400% 400%;
      animation: bgShift 10s ease infinite;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      align-self: flex-start;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #e040fb, #2979ff, #00bcd4, #66bb6a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e0c6f9;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fdf6ff;
    }

    .input-row input:focus { border-color: #e040fb; }

    .input-row button {
      padding: 10px 18px;
      background: linear-gradient(135deg, #e040fb, #2979ff);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .input-row button:hover { opacity: 0.85; transform: scale(1.04); }

    ul { list-style: none; }

    /* Rotating palette of pastel left-border colors */
    li { border-left: 4px solid #ccc; }
    li:nth-child(7n+1) { border-left-color: #e040fb; }
    li:nth-child(7n+2) { border-left-color: #2979ff; }
    li:nth-child(7n+3) { border-left-color: #00bcd4; }
    li:nth-child(7n+4) { border-left-color: #66bb6a; }
    li:nth-child(7n+5) { border-left-color: #ffb300; }
    li:nth-child(7n+6) { border-left-color: #ff5722; }
    li:nth-child(7n+0) { border-left-color: #ab47bc; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      background: #fff;
      transition: background 0.2s;
    }

    li:hover { background: #fdf6ff; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #e040fb;
    }

    li span {
      flex: 1;
      font-size: 1rem;
      color: #333;
      cursor: pointer;
      word-break: break-word;
    }

    li.done span {
      text-decoration: line-through;
      color: #bbb;
    }

    li button {
      background: none;
      border: none;
      color: #ddd;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    li button:hover { color: #e040fb; background: #fce4fc; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.95rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Nový úkol..." />
      <button onclick="addTask()">Přidat</button>
    </div>
    <ul id="taskList"></ul>
    <p class="empty" id="emptyMsg">Žádné úkoly. Přidej první!</p>
  </div>

  <script>
    const input = document.getElementById('taskInput');
    const list  = document.getElementById('taskList');
    const empty = document.getElementById('emptyMsg');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const li = document.createElement('li');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', () => li.classList.toggle('done', cb.checked));

      const span = document.createElement('span');
      span.textContent = text;
      span.addEventListener('click', () => { cb.checked = !cb.checked; li.classList.toggle('done', cb.checked); });

      const del = document.createElement('button');
      del.textContent = '×';
      del.title = 'Smazat';
      del.addEventListener('click', () => { li.remove(); updateEmpty(); });

      li.append(cb, span, del);
      list.appendChild(li);
      updateEmpty();
      input.focus();
    }

    function updateEmpty() {
      empty.style.display = list.children.length ? 'none' : 'block';
    }
  </script>
</body>
</html>
