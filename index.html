<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      color: #222;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #4f8ef7; }

    .input-row button {
      padding: 10px 18px;
      background: #4f8ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover { background: #3a78e0; }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    li:last-child { border-bottom: none; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4f8ef7;
    }

    li span {
      flex: 1;
      font-size: 1rem;
      color: #333;
      cursor: pointer;
      word-break: break-word;
    }

    li.done span {
      text-decoration: line-through;
      color: #aaa;
    }

    li button {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    li button:hover { color: #e74c3c; background: #fdecea; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.95rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Nový úkol..." />
      <button onclick="addTask()">Přidat</button>
    </div>
    <ul id="taskList"></ul>
    <p class="empty" id="emptyMsg">Žádné úkoly. Přidej první!</p>
  </div>

  <script>
    const input = document.getElementById('taskInput');
    const list  = document.getElementById('taskList');
    const empty = document.getElementById('emptyMsg');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const li = document.createElement('li');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', () => li.classList.toggle('done', cb.checked));

      const span = document.createElement('span');
      span.textContent = text;
      span.addEventListener('click', () => { cb.checked = !cb.checked; li.classList.toggle('done', cb.checked); });

      const del = document.createElement('button');
      del.textContent = '×';
      del.title = 'Smazat';
      del.addEventListener('click', () => { li.remove(); updateEmpty(); });

      li.append(cb, span, del);
      list.appendChild(li);
      updateEmpty();
      input.focus();
    }

    function updateEmpty() {
      empty.style.display = list.children.length ? 'none' : 'block';
    }
  </script>
</body>
</html>
